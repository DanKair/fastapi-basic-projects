services:
  # Redis service for caching
  redis:
    image: redis:alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  # FastAPI service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    # We need to ensure that the Redis service is up and running before starting the FastAPI service
    depends_on:
      - redis
    # Mount a volume for the SQLite database to persist data
    volumes:
      - sqlite_data:/app/data

volumes:
  redis_data:
  sqlite_data:
